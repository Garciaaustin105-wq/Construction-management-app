# Nightly Supabase DB backup. Runs scripts/backup-db.sh, which pg_dumps the
# production database and uploads the gzipped dump to a private Supabase Storage
# bucket (db-backups). Keeps the newest 30 by default. This is the data-loss
# safety net for the Free Supabase plan, which has no automated backups.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL           postgres connection string (dashboard → Project
#                             Settings → Database → Connection string → URI)
#   SUPABASE_URL               https://<project-ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service-role key (server only — keep secret)
#
# Optional repo variables (Settings → Secrets → Variables):
#   BACKUP_RETAIN_COUNT  how many dumps to keep (default 30)
#
# Run it on demand from the Actions tab ("Run workflow") too.
name: nightly-db-backup

on:
  schedule:
    # 06:17 UTC daily — off-peak, and off the :00 mark to spread API load.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install postgres client (for pg_dump) + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client jq

      - name: Run backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_RETAIN_COUNT: ${{ vars.BACKUP_RETAIN_COUNT }}
        run: bash scripts/backup-db.sh

      - name: Verify a backup object now exists (smoke check)
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X POST "$SUPABASE_URL/storage/v1/object/list/db-backups" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"backups/","limit":1,"offset":0,"sortBy":{"column":"name","order":"desc"}}' \
            | jq -e 'length > 0' >/dev/null && echo "backup present" || { echo "no backup found"; exit 1; }