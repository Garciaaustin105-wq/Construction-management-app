<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" role="img" aria-label="Terra Vista Construction Management">
  <defs>
    <linearGradient id="tv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#0b2f6b"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g>
    <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#tv-bg)"/>
    <!-- rising sun -->
    <circle cx="53" cy="69" r="15" fill="#7dd3fc" opacity="0.9"/>
    <!-- horizon line -->
    <line x1="18" y1="69" x2="82" y2="69" stroke="#dbeafe" stroke-width="2.5" stroke-linecap="round"/>
    <!-- main building -->
    <polygon points="41,47 52,38 63,47" fill="#ffffff"/>
    <rect x="41" y="47" width="22" height="22" fill="#ffffff"/>
    <!-- second block -->
    <rect x="63" y="55" width="13" height="14" fill="#bfdbfe"/>
    <!-- windows (blueprint cutouts) -->
    <rect x="45" y="51" width="4" height="4" fill="#0b2f6b"/>
    <rect x="53" y="51" width="4" height="4" fill="#0b2f6b"/>
    <rect x="45" y="59" width="4" height="4" fill="#0b2f6b"/>
    <rect x="53" y="59" width="4" height="4" fill="#0b2f6b"/>
    <rect x="66" y="59" width="3.5" height="3.5" fill="#0b2f6b"/>
  </g>

  <!-- Wordmark -->
  <text x="108" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="700" fill="#0b2f6b" letter-spacing="0.5">Terra Vista</text>

  <!-- Tagline -->
  <text x="110" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="3.2">CONSTRUCTION MANAGEMENT</text>
</svg>