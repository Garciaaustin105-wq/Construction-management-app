<?xml version="1.0" encoding="UTF-8"?>
<!-- Terra Verde full logo — green sprout mark + wordmark. Used on auth /
     marketing / error pages via BRAND.logoPath. v1 hand-authored (text-based
     wordmark so it renders reliably); safe to replace with a designer vector. -->
<svg width="560" height="140" viewBox="0 0 560 140" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(10,10)">
    <rect width="120" height="120" rx="28" fill="#15803d" />
    <g fill="#ffffff" transform="translate(60,60)">
      <rect x="-10" y="-6" width="20" height="56" rx="10" />
      <ellipse cx="-40" cy="-2" rx="40" ry="19" transform="rotate(-32 -40 -2)" />
      <ellipse cx="40" cy="-2" rx="40" ry="19" transform="rotate(32 40 -2)" />
      <circle cx="0" cy="-14" r="9" />
    </g>
  </g>
  <text x="150" y="70" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="50" font-weight="800" fill="#15803d">Terra Verde</text>
  <text x="152" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#166534" letter-spacing="2.5">LAWN MANAGEMENT</text>
</svg>