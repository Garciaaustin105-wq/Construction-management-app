<!DOCTYPE html>
<!-- Recorded-footage review (A3 slice 2). Contract: REVIEW-UI-SPEC.md section 2.
     Plain page, no framework. Every decision that can be wrong without looking
     wrong (gap widening, the future tail, which segment a click means, a
     hostile segment id) lives in /ui/review-client.js and is harness-tested;
     this file only fetches, draws and plays. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 12px;
    background: #14161a;
    color: #e8eaed;
    font: 14px/1.4 system-ui, sans-serif;
  }
  a { color: #8ab4f8; }
  header { display: flex; align-items: baseline; gap: 14px; margin: 0 0 10px; }
  header h1 { margin: 0; font-size: 18px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; }
  .controls select, .controls input, .controls button, .status button {
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid #4a4f58;
    border-radius: 5px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
  }
  .controls button, .status button { cursor: pointer; }
  .alertBanner { margin: 0 0 12px; padding: 8px 10px; border-radius: 6px; }
  .alertBanner.problem { background: #3a1d1d; color: #ffb4b4; }
  .alertBanner.notice { background: #2c2a1d; color: #f1e3a0; }
  .alertBanner .problem, .alertBanner .notice { margin: 2px 0; }
  .pageError {
    margin: 0 0 12px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #3a1d1d;
    color: #ffb4b4;
  }
  .strip {
    position: relative;
    height: 36px;
    border: 1px solid #2c2f36;
    border-radius: 6px;
    background: #1b1d22;
    overflow: hidden;
    cursor: crosshair;
  }
  .bar { position: absolute; top: 0; bottom: 0; }
  .bar.recorded { background: #2e7d32; }
  .bar.gap { background: #c62828; }
  /* Never held, not a failure: renders as nothing so the strip's own dark
     background (#1b1d22, see .strip above) shows through. No border either —
     there is nothing here to outline. Deliberately no .legend entry: nothing
     to see is nothing to explain. */
  .bar.nodata { background: transparent; border: none; }
  .bar.future { box-sizing: border-box; border: 1px dashed #6b7078; background: transparent; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; }
  .hours { position: relative; height: 18px; margin: 2px 0 8px; color: #b6bcc4; font-size: 12px; }
  /* The first label sits at left: 0, so centring it puts half of it off the screen. */
  .hours span:first-child { transform: none; }
  .hours span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 12px; color: #b6bcc4; font-size: 12px; }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 5px; vertical-align: -2px; border-radius: 2px; }
  .legend .recorded { background: #2e7d32; }
  .legend .gap { background: #c62828; }
  .legend .future { box-sizing: border-box; border: 1px dashed #6b7078; }
  /* A mark sits ON the coverage bar, tall enough to see at a glance on a
     24-hour strip and wide enough to hit with a finger. */
  .mark { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; cursor: pointer; }
  .mark.person { background: #64b5f6; }
  .mark.vehicle { background: #ffb74d; }
  .mark.plate { background: #ce93d8; }
  .mark.here { width: 5px; margin-left: -2px; background: #fff; }
  .events { margin: 0 0 12px; }
  .eventBar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; }
  .eventBar button {
    padding: 6px 12px;
    border: 1px solid #4a4f58;
    border-radius: 5px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    cursor: pointer;
  }
  .eventBar button[disabled] { opacity: 0.45; cursor: default; }
  /* A filter that is OFF is drawn as off, not merely un-highlighted: an
     operator must never mistake "vehicles hidden" for "no vehicles". */
  .eventBar .filter[aria-pressed="false"] { background: #1b1d22; color: #868c94; border-style: dashed; }
  .eventBar .filter i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; border-radius: 2px; }
  .eventBar .filter.person i { background: #64b5f6; }
  .eventBar .filter.vehicle i { background: #ffb74d; }
  .eventBar .filter.plate i { background: #ce93d8; }
  .eventTiles { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; }
  .eventTiles button {
    flex: 0 0 auto;
    min-width: 120px;
    padding: 6px 10px;
    border: 1px solid #3a3f48;
    border-left-width: 4px;
    border-radius: 5px;
    background: #22242a;
    color: #e8eaed;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .eventTiles button.person { border-left-color: #64b5f6; }
  .eventTiles button.vehicle { border-left-color: #ffb74d; }
  .eventTiles button.plate { border-left-color: #ce93d8; }
  .eventTiles button.here { border-color: #fff; border-left-color: #fff; }
  /* Reserved at a fixed ratio so a tile is the same height loading, loaded or
     never requested at all: nothing under a finger about to tap it moves when
     a crop lands (or a sibling's does). */
  .eventTiles .thumbBox { display: block; width: 100%; aspect-ratio: 4 / 3; margin: 0 0 6px; border-radius: 4px; overflow: hidden; background: #1b1d22; }
  .eventTiles .thumb { display: block; width: 100%; height: 100%; object-fit: cover; }
  .eventTiles .thumb[hidden] { display: none; }
  .eventTiles .when { display: block; font-weight: 600; }
  .eventTiles .what { display: block; color: #b6bcc4; font-size: 12px; }
  .eventNote { color: #9aa0a6; font-size: 12px; min-height: 1.2em; }
  video { display: block; width: 100%; max-width: 960px; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; }
  .status { margin: 8px 0 0; min-height: 1.4em; color: #9aa0a6; }
  .status.problem { color: #ffb4b4; }
  .export { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 0; }
  .export input, .export button {
    padding: 4px 10px;
    border: 1px solid #4a4f58;
    border-radius: 5px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
  }
  .export button { cursor: pointer; }
  .exportStatus { flex-basis: 100%; color: #b6bcc4; }
  .exportStatus.problem { color: #ffb4b4; }
  .testclip {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 14px 0 0;
  }
  .testclip input,
  .testclip select,
  .testclip button {
    padding: 4px 10px;
    border: 1px solid #4a4f58;
    border-radius: 5px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
  }
  .testclip button {
    cursor: pointer;
  }
  .testclip .tag {
    white-space: nowrap;
  }
  .clipStatus {
    flex-basis: 100%;
    color: #b6bcc4;
  }
  .clipStatus.problem {
    color: #ffb4b4;
  }
  .clipStatus.saved {
    color: #9fe0a8;
  }
  /* ── the friendly Review page: a phone is the screen this is used on, so
     every tap target is at least 44px and nothing is typed. ─────────────── */
  .hidden, #camera, #day, #clipPeople, #clipVehicles { display: none; }
  .cameras { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
  .camTile {
    flex: 1 1 130px;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid #4a4f58;
    border-radius: 8px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .camTile.chosen { border-color: #8ab4f8; background: #33415c; }
  .daybar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; }
  .daybar button {
    min-height: 44px;
    padding: 8px 14px;
    border: 1px solid #4a4f58;
    border-radius: 8px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    cursor: pointer;
  }
  .daybar #dayBtn { flex: 1 1 auto; text-align: left; font-weight: 600; }
  .calendar {
    max-width: 380px;
    margin: 0 0 12px;
    padding: 10px;
    border: 1px solid #2c2f36;
    border-radius: 8px;
    background: #1b1d22;
  }
  .calHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
  .calHead button {
    min-width: 44px;
    min-height: 40px;
    border: 1px solid #4a4f58;
    border-radius: 8px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    cursor: pointer;
  }
  .calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calDow { text-align: center; font-size: 12px; color: #9aa0a6; }
  .calDay {
    min-height: 46px;
    border: 1px solid #383c44;
    border-radius: 8px;
    background: #22252b;
    color: #6b7078;
    font: inherit;
    cursor: pointer;
  }
  .calDay.recorded { border-color: #2e7d32; background: #24322a; color: #e8eaed; }
  .calDot { display: block; width: 6px; height: 6px; margin: 2px auto 0; border-radius: 50%; background: #5cc463; }
  .exactNote { margin: 0 0 8px; color: #b6bcc4; }
  .calDay.chosen { border-color: #8ab4f8; background: #33415c; color: #fff; }
  .calBlank { min-height: 46px; }
  .moment { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .big {
    flex: 1 1 160px;
    min-height: 52px;
    padding: 10px 14px;
    border: 1px solid #4a4f58;
    border-radius: 10px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    font-size: 16px;
    cursor: pointer;
  }
  .big.go { border-color: #2e7d32; background: #24322a; }
  .sheet {
    margin: 12px 0 0;
    padding: 12px;
    border: 1px solid #2c2f36;
    border-radius: 10px;
    background: #1b1d22;
  }
  .sheetHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
  .sheetHead h2 { margin: 0; font-size: 16px; }
  .sheetHead button {
    min-height: 40px;
    padding: 6px 12px;
    border: 1px solid #4a4f58;
    border-radius: 8px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    cursor: pointer;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .chip, .chips .tag {
    min-height: 44px;
    padding: 8px 14px;
    border: 1px solid #4a4f58;
    border-radius: 22px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    white-space: nowrap;
    cursor: pointer;
  }
  .chips .tag { display: inline-flex; align-items: center; gap: 6px; }
  .chip.on { border-color: #8ab4f8; background: #33415c; }
  .sheetRange { margin: 0 0 10px; color: #b6bcc4; font-size: 15px; }
  .counts { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 0 0 10px; }
  .counter { display: inline-flex; align-items: center; gap: 6px; }
  .counter .cLabel { display: inline-block; min-width: 4.5em; }
  .counter button {
    width: 46px;
    min-height: 46px;
    border: 1px solid #4a4f58;
    border-radius: 8px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
    font-size: 18px;
    cursor: pointer;
  }
  .counter .n { min-width: 2em; text-align: center; font-size: 16px; }
  .sheetStatus { min-height: 1.4em; margin: 8px 0 0; color: #9aa0a6; }
  .sheetStatus.problem { color: #ffb4b4; }
  .sheetStatus.saved { color: #9fe0a8; }
  .progress { margin: 8px 0 0; color: #b6bcc4; font-size: 13px; }
  details.exact { margin: 10px 0 0; color: #9aa0a6; }
  details.exact summary { min-height: 40px; cursor: pointer; }
  details.exact select {
    min-height: 44px;
    padding: 6px 10px;
    border: 1px solid #4a4f58;
    border-radius: 8px;
    background: #2c2f36;
    color: #e8eaed;
    font: inherit;
  }
</style>
</head>
<body>
<header><a href="/">Live</a><h1>Review</h1></header>
<div class="alertBanner" id="alertBanner" role="status" hidden></div>

<!-- Pick a camera by tapping it; the select is the page's single answer to
     "which camera", kept out of sight rather than removed. -->
<div class="cameras" id="cameraTiles"></div>
<select id="camera" aria-label="Camera"></select>

<div class="daybar">
  <button id="dayBtn" type="button" aria-expanded="false">Pick a day</button>
  <button id="prevDay" type="button">Previous day</button>
  <button id="nextDay" type="button">Next day</button>
</div>
<input id="day" type="date" aria-label="Day">

<div class="calendar" id="calendar" hidden>
  <div class="calHead">
    <button id="calPrev" type="button" aria-label="Previous month">&lt;</button>
    <span id="calLabel"></span>
    <button id="calNext" type="button" aria-label="Next month">&gt;</button>
  </div>
  <div class="calGrid">
    <span class="calDow">Sun</span><span class="calDow">Mon</span><span class="calDow">Tue</span><span class="calDow">Wed</span><span class="calDow">Thu</span><span class="calDow">Fri</span><span class="calDow">Sat</span>
  </div>
  <div class="calGrid" id="calGrid"></div>
</div>

<div class="pageError" id="pageError" hidden></div>

<div class="strip" id="strip"><div class="playhead" id="playhead" hidden></div></div>
<div class="hours" id="hours"></div>
<div class="legend">
  <span><i class="recorded"></i>Recorded</span>
  <span><i class="gap"></i>Not recorded</span>
  <span><i class="future"></i>Not yet happened</span>
</div>

<!-- What the detector found on this day. Hidden outright when this recorder
     has no detector, or when the account may not see events: an empty row
     here would read as "nothing happened", which is a different claim. -->
<div class="events" id="events" hidden>
  <div class="eventBar">
    <button id="prevEvent" type="button">Previous event</button>
    <button id="nextEvent" type="button">Next event</button>
    <button id="filterPerson" class="filter person" type="button" aria-pressed="true"><i></i>People</button>
    <button id="filterVehicle" class="filter vehicle" type="button" aria-pressed="true"><i></i>Vehicles</button>
    <button id="filterPlate" class="filter plate" type="button" aria-pressed="true" hidden><i></i>Plates</button>
  </div>
  <div class="eventTiles" id="eventTiles"></div>
  <div class="eventNote" id="eventNote"></div>
</div>

<video id="video" controls playsinline></video>
<div class="controls">
  <button id="back10" type="button">-10s</button>
  <button id="slower" type="button">Slower</button>
  <span id="rate">1x</span>
  <button id="faster" type="button">Faster</button>
  <button id="fwd10" type="button">+10s</button>
  <span id="clock">--:--:--</span>
</div>
<div class="status" id="status"></div>

<!-- What to do with the moment on screen. Both buttons open the same sheet;
     the only choice inside it is how long a stretch around that moment. -->
<div class="moment">
  <button id="saveVideoBtn" class="big" type="button">Save video</button>
  <button id="teachBtn" class="big" type="button">Teach the AI</button>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheetHead">
    <h2 id="sheetTitle">Save video</h2>
    <button id="sheetClose" type="button">Close</button>
  </div>
  <div class="chips" id="lengthChips"></div>
  <div class="sheetRange" id="sheetRange"></div>

  <div id="teachFields" hidden>
    <div class="chips">
      <button id="nobodyChip" class="chip" type="button">Nobody</button>
    </div>
    <div class="counts">
      <span class="counter"><span class="cLabel">People</span>
        <button id="peopleMinus" type="button" aria-label="Fewer people">-</button>
        <span class="n" id="peopleN">0</span>
        <button id="peoplePlus" type="button" aria-label="More people">+</button>
      </span>
      <span class="counter"><span class="cLabel">Cars</span>
        <button id="vehiclesMinus" type="button" aria-label="Fewer cars">-</button>
        <span class="n" id="vehiclesN">0</span>
        <button id="vehiclesPlus" type="button" aria-label="More cars">+</button>
      </span>
    </div>
    <div class="chips">
      <label class="tag"><input type="checkbox" id="clipTag-night" name="clipTag" value="night"> Night</label>
      <label class="tag"><input type="checkbox" id="clipTag-rain" name="clipTag" value="rain"> Rain</label>
      <label class="tag"><input type="checkbox" id="clipTag-shadows" name="clipTag" value="shadows"> Shadows</label>
      <label class="tag"><input type="checkbox" id="clipTag-headlights" name="clipTag" value="headlights"> Headlights</label>
      <label class="tag"><input type="checkbox" id="clipTag-animal" name="clipTag" value="animal"> Animal</label>
    </div>
    <!-- What the counters and the Nobody chip actually set. Kept as the page's
         one answer for each, out of sight rather than removed. -->
    <label class="hidden"><input type="checkbox" id="clipTag-empty" name="clipTag" value="empty"> Empty</label>
    <label class="hidden"><input type="checkbox" id="clipTag-person" name="clipTag" value="person"> Person</label>
    <label class="hidden"><input type="checkbox" id="clipTag-vehicle" name="clipTag" value="vehicle"> Vehicle</label>
    <select id="clipPeople"></select>
    <select id="clipVehicles"></select>
    <div class="progress" id="teachProgress"></div>
  </div>

  <button id="sheetGo" class="big go" type="button">Save video</button>
  <button id="clipSaveBtn" class="hidden" type="button">Save as test clip</button>
  <div class="sheetStatus" id="sheetStatus"></div>
  <div class="clipStatus" id="clipStatus"></div>
  <div class="exportStatus" id="exportStatus"></div>

  <details class="exact" id="exactTimes">
    <summary>Exact times</summary>
    <div class="exactNote" id="exactNote"></div>
    <div class="export">
      <label>From <select id="exportFrom"></select></label>
      <label>to <select id="exportTo"></select></label>
      <button id="exportBtn" type="button">Check export</button>
    </div>
  </details>
</div>

<script type="module">
import { layoutCoverage, fractionToInstant, instantToFraction, describeGap, planPlayback, planExportOffer,
  monthCalendar, timeOptions, recordedDays, rangeAround, friendlyProblem, clipProgress,
  eventMarkers, stepToEvent, seekInstantFor, markerSummary, refreshDecision } from '/ui/review-client.js';
import { PLAYBACK_RATES, nextRate, rateLabel } from '/ui/playback.js';
import { startAlertBanner } from '/ui/alert-banner.js';

const el = {
  camera: document.getElementById('camera'),
  day: document.getElementById('day'),
  prevDay: document.getElementById('prevDay'),
  nextDay: document.getElementById('nextDay'),
  pageError: document.getElementById('pageError'),
  strip: document.getElementById('strip'),
  playhead: document.getElementById('playhead'),
  hours: document.getElementById('hours'),
  video: document.getElementById('video'),
  status: document.getElementById('status'),
  exportFrom: document.getElementById('exportFrom'),
  exportTo: document.getElementById('exportTo'),
  exportBtn: document.getElementById('exportBtn'),
  exportStatus: document.getElementById('exportStatus'),
  slower: document.getElementById('slower'),
  faster: document.getElementById('faster'),
  rate: document.getElementById('rate'),
  back10: document.getElementById('back10'),
  fwd10: document.getElementById('fwd10'),
  clock: document.getElementById('clock'),
  cameraTiles: document.getElementById('cameraTiles'),
  dayBtn: document.getElementById('dayBtn'),
  calendar: document.getElementById('calendar'),
  calPrev: document.getElementById('calPrev'),
  calNext: document.getElementById('calNext'),
  calLabel: document.getElementById('calLabel'),
  calGrid: document.getElementById('calGrid'),
  saveVideoBtn: document.getElementById('saveVideoBtn'),
  teachBtn: document.getElementById('teachBtn'),
  sheet: document.getElementById('sheet'),
  sheetTitle: document.getElementById('sheetTitle'),
  sheetClose: document.getElementById('sheetClose'),
  sheetGo: document.getElementById('sheetGo'),
  sheetStatus: document.getElementById('sheetStatus'),
  sheetRange: document.getElementById('sheetRange'),
  lengthChips: document.getElementById('lengthChips'),
  teachFields: document.getElementById('teachFields'),
  teachProgress: document.getElementById('teachProgress'),
  exactNote: document.getElementById('exactNote'),
  nobodyChip: document.getElementById('nobodyChip'),
  peopleMinus: document.getElementById('peopleMinus'),
  peopleN: document.getElementById('peopleN'),
  peoplePlus: document.getElementById('peoplePlus'),
  vehiclesMinus: document.getElementById('vehiclesMinus'),
  vehiclesN: document.getElementById('vehiclesN'),
  vehiclesPlus: document.getElementById('vehiclesPlus'),
  clipPeople: document.getElementById('clipPeople'),
  clipVehicles: document.getElementById('clipVehicles'),
  events: document.getElementById('events'),
  prevEvent: document.getElementById('prevEvent'),
  nextEvent: document.getElementById('nextEvent'),
  filterPerson: document.getElementById('filterPerson'),
  filterVehicle: document.getElementById('filterVehicle'),
  filterPlate: document.getElementById('filterPlate'),
  eventTiles: document.getElementById('eventTiles'),
  eventNote: document.getElementById('eventNote'),
};

// What is on screen now. `requested` is the /timeline body's requested range
// ({ startUtc, endUtc }) of the day being shown, or null before one loads.
// `playing` is the last "play" plan, or null when nothing is playing.
// `loadSeq` increments on every loadDay call, so a slow /timeline answer for
// a day the user has already left is dropped instead of drawn.
// `exportSeq` does the same for /export/plan: every offerExport and every
// clearExport increments it, so a slow plan never offers a stale download.
// `sheetWindow` is the range a length chip chose, or null when the Exact
// times dropdowns are the answer. `recordedDays` is the days of the month in
// view that have footage, and monthSeq drops a slow answer for a month left.
// `events` is the day's detections as the recorder gave them (every kind:
// the filter is applied here, so the counts on the buttons stay honest while
// one is switched off). `kinds` is which are shown, `here` is the id of the
// event the buttons last jumped to, and `eventSeq` drops a slow /events
// answer for a day already left, exactly as loadSeq does for the timeline.
const view = { requested: null, playing: null, loadSeq: 0, playSeq: 0, exportSeq: 0,
  calYear: 0, calMonth: 0, recordedDays: [], monthSeq: 0,
  sheetMode: null, sheetLength: 5, sheetWindow: null,
  events: [], markers: [], kinds: ['person', 'vehicle', 'plate'], here: null,
  eventSeq: 0, eventsTruncated: false, lastLoadMs: null };

// Every text that came from the server or a camera goes in with textContent.
// Nothing in this page parses a string as HTML.

const two = (n) => String(n).padStart(2, '0');

/** Local wall-clock "HH:MM" for a UTC ISO string. */
const localTime = (utc) => {
  const d = new Date(utc);
  return two(d.getHours()) + ':' + two(d.getMinutes());
};

/** Show a whole-page problem (null hides it). */
function showPageError(message) {
  el.pageError.hidden = message === null;
  el.pageError.textContent = message ?? '';
}

/** Set the line under the video. kind "problem" colours it; anything else is plain. */
function setStatus(message, kind) {
  el.status.className = kind === 'problem' ? 'status problem' : 'status';
  el.status.textContent = message;
}

/**
 * The local calendar day `value` ("YYYY-MM-DD", what <input type="date">
 * gives) as a UTC window: local midnight to the NEXT local midnight.
 * Returns { startUtc, endUtc } as ISO strings (Date#toISOString), or null when
 * value is not exactly four digits, "-", two digits, "-", two digits, or names
 * a day that does not exist (month 13, February 30: check that the Date built
 * from y, m - 1, d reads back the same year, month and date).
 * Build both ends with the Date constructor, new Date(y, m - 1, d) and
 * new Date(y, m - 1, d + 1): a DST day is 23 or 25 hours long, so never add
 * a fixed day of milliseconds.
 */
function dayWindow(value) {
  if (typeof value !== 'string') return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const start = new Date(y, mo - 1, d);
  if (start.getFullYear() !== y || start.getMonth() !== mo - 1 || start.getDate() !== d) return null;
  const end = new Date(y, mo - 1, d + 1);
  return { startUtc: start.toISOString(), endUtc: end.toISOString() };
}

/**
 * "YYYY-MM-DD" for the local day `days` days after the local day `value`
 * (negative goes back), or null when dayWindow(value) is null. Build with
 * new Date(y, m - 1, d + days) and read back getFullYear, getMonth() + 1 and
 * getDate(), each zero-padded (use two() for month and day).
 */
function shiftDay(value, days) {
  if (dayWindow(value) === null) return null;
  const m = /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/.exec(value);
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  const t = new Date(y, mo - 1, d + days);
  const y2 = t.getFullYear();
  const mo2 = t.getMonth() + 1;
  const d2 = t.getDate();
  return y2 + '-' + two(mo2) + '-' + two(d2);
}

/**
 * Fill the camera <select> from GET /cameras, then call loadDay().
 * - /cameras answers a JSON array of objects with `cameraId` and optional
 *   `name`. One <option> per camera: value = cameraId, text = name when it is
 *   a non-empty string, else cameraId. Set option.value and option.textContent.
 * - The fetch fails or the body is not JSON (the try/catch covers ONLY the
 *   fetch and res.json(), nothing after), or it is not an array:
 *   showPageError("Cannot reach the recorder (" + location.host + ")") and stop.
 * - An empty array: showPageError("This recorder has no cameras configured")
 *   and stop.
 * - Otherwise showPageError(null), then await loadDay() OUTSIDE any try: an
 *   error thrown while drawing is the page's own bug and must reach the
 *   caller as itself, never be reported as an unreachable recorder.
 */
async function loadCameras() {
  let body;
  let reached = true;
  try {
    const res = await fetch('/cameras');
    body = await res.json();
  } catch (e) {
    reached = false;
  }
  if (!reached || !Array.isArray(body)) {
    showPageError('Cannot reach the recorder (' + location.host + ')');
    return;
  }
  if (body.length === 0) {
    showPageError('This recorder has no cameras configured');
    return;
  }
  // Remove existing options
  for (const c of Array.from(el.camera.childNodes)) {
    el.camera.removeChild(c);
  }
  let firstValue = null;
  for (const cam of body) {
    if (typeof cam !== 'object' || cam === null || typeof cam.cameraId !== 'string') continue;
    const o = document.createElement('option');
    o.value = cam.cameraId;
    o.textContent = (typeof cam.name === 'string' && cam.name !== '') ? cam.name : cam.cameraId;
    el.camera.appendChild(o);
    if (firstValue === null) firstValue = o.value;
  }
  if (firstValue !== null) el.camera.value = firstValue;
  drawCameraTiles();
  showPageError(null);
  await loadDay();
}

/**
 * Load and draw the day in el.day for the camera in el.camera.
 * 1. const seq = ++view.loadSeq.
 * 2. win = dayWindow(el.day.value). null: showPageError("Pick a day") and stop.
 * 3. GET /timeline with a URLSearchParams query: camera = el.camera.value,
 *    start = win.startUtc, end = win.endUtc, buckets = "96".
 * 4. After the await (and after reading the JSON), if seq !== view.loadSeq,
 *    return without touching the page: the user has moved on.
 * 5. Fetch or JSON failure: showPageError("Cannot reach the recorder ("
 *    + location.host + ")"), clearStrip(), stop. The try/catch covers ONLY
 *    the fetch and res.json(); steps 6 to 8 run outside it, so an error thrown
 *    while drawing reaches the caller as itself. (Step 4's check comes first
 *    for a failure too: a stale failure touches nothing.)
 * 6. body.ok === false: showPageError(friendlyProblem(body.code, body.message)),
 *    clearStrip(), stop. (A day entirely in the future arrives here as
 *    window_in_future, which reads "That day has not happened yet.")
 * 7. layout = layoutCoverage(body). layout.error: showPageError("The recorder
 *    sent a timeline this page cannot draw: " + layout.error), clearStrip(),
 *    stop.
 * 8. showPageError(null); view.requested = body.requested;
 *    drawStrip(layout.bars); drawHours(win); movePlayhead(null);
 *    fillTimeDropdowns(body.runs).
 */
async function loadDay() {
  const seq = ++view.loadSeq;
  const win = dayWindow(el.day.value);
  if (!win) {
    showPageError('Pick a day');
    return;
  }
  const q = new URLSearchParams({
    camera: el.camera.value,
    start: win.startUtc,
    end: win.endUtc,
    buckets: '96'
  });
  let body;
  let reached = true;
  try {
    const res = await fetch('/timeline?' + q.toString());
    body = await res.json();
  } catch (e) {
    reached = false;
  }
  if (seq !== view.loadSeq) return;
  if (!reached || !body || typeof body !== 'object') {
    showPageError('Cannot reach the recorder (' + location.host + ')');
    clearStrip();
    return;
  }
  if (body.ok === false) {
    showPageError(friendlyProblem(body.code, body.message));
    clearStrip();
    return;
  }
  const layout = layoutCoverage(body);
  if (layout.error) {
    showPageError('The recorder sent a timeline this page cannot draw: ' + layout.error);
    clearStrip();
    return;
  }
  showPageError(null);
  view.requested = body.requested;
  drawStrip(layout.bars);
  drawHours(win);
  movePlayhead(null);
  fillTimeDropdowns(body.runs);
  drawDayButton();
  // After the coverage bar: drawStrip clears the strip, marks included, so
  // the marks must be drawn onto a bar that is already there.
  loadEvents(win);
}

/**
 * Empty the strip and the hour labels and forget the drawn day:
 * view.requested = null. Remove every child of el.strip EXCEPT el.playhead,
 * hide the playhead (el.playhead.hidden = true), and remove every child of
 * el.hours.
 */
/**
 * Ask the recorder what the detector found on the day now drawn, and draw it.
 *
 * Every kind is fetched, whatever the filter is: the counts on the filter
 * buttons then describe the day rather than the filter, and switching one on
 * is instant instead of another round trip.
 *
 * Three answers are NOT the same and are never shown the same way:
 * - 403: this account may not see events (a wall display). The row is hidden.
 * - available false: no detector on this recorder. The row is hidden.
 * - available true with an empty list: nothing walked past. The row says so.
 */
async function loadEvents(win) {
  const seq = ++view.eventSeq;
  // Let go of the last day BEFORE asking about this one. Otherwise yesterday's
  // marks and counts sit under today's bar for as long as the answer takes,
  // which is the same lie as a slow timeline drawn over the day you moved to.
  resetEvents();
  const q = new URLSearchParams({ camera: el.camera.value, start: win.startUtc, end: win.endUtc });
  let body;
  let reached = true;
  try {
    const res = await fetch('/events?' + q.toString());
    body = await res.json();
  } catch (e) {
    reached = false;
  }
  if (seq !== view.eventSeq) return;
  view.events = [];
  view.eventsTruncated = false;
  view.here = null;
  if (!reached || !body || typeof body !== 'object' || body.ok === false || body.available === false) {
    // Nothing here is a page error: the timeline itself is fine, and the
    // recorder is still answering. The row simply has nothing to say.
    drawEvents();
    el.events.hidden = true;
    return;
  }
  view.events = Array.isArray(body.events) ? body.events : [];
  view.eventsTruncated = body.truncated === true;
  el.events.hidden = false;
  drawEvents();
}

/** Forget the day's events and take the row off the page. */
function resetEvents() {
  view.events = [];
  view.markers = [];
  view.here = null;
  view.eventsTruncated = false;
  el.events.hidden = true;
  el.eventTiles.textContent = '';
  el.eventNote.textContent = '';
  for (const c of Array.from(el.strip.childNodes)) {
    if (c !== el.playhead && c.className && String(c.className).startsWith('mark')) el.strip.removeChild(c);
  }
}

/**
 * Draw the marks, the tiles, the filter buttons and the note from
 * view.events. Called after every load and after every filter change.
 */
function drawEvents() {
  const all = view.requested === null
    ? { markers: [], dropped: { outsideWindow: 0, unreadable: 0, filteredOut: 0 } }
    : eventMarkers(view.events, view.requested.startUtc, view.requested.endUtc, null);
  const shown = view.requested === null
    ? { markers: [], dropped: { outsideWindow: 0, unreadable: 0, filteredOut: 0 } }
    : eventMarkers(view.events, view.requested.startUtc, view.requested.endUtc, view.kinds);
  view.markers = shown.markers;
  const counts = markerSummary(all.markers);

  for (const [kind, button] of [['person', el.filterPerson], ['vehicle', el.filterVehicle], ['plate', el.filterPlate]]) {
    const on = view.kinds.includes(kind);
    button.setAttribute('aria-pressed', on ? 'true' : 'false');
    const label = kind === 'person' ? 'People' : kind === 'vehicle' ? 'Vehicles' : 'Plates';
    const i = document.createElement('i');
    button.textContent = '';
    button.appendChild(i);
    button.appendChild(document.createTextNode(label + ' (' + counts[kind] + ')'));
    // Plates only when this recorder reads them: an always-present "Plates (0)"
    // says a reader looked and found none, which is not true here.
    if (kind === 'plate') button.hidden = counts.plate === 0;
  }

  drawMarks(shown.markers);
  drawTiles(shown.markers);

  const bits = [];
  if (counts.total === 0) {
    bits.push('Nothing detected on this day.');
  } else {
    bits.push(shown.markers.length + ' of ' + counts.total + ' shown.');
  }
  // Build rule 16: say what could not be used, and why.
  if (view.eventsTruncated) bits.push('This is as many as the recorder will send at once; narrow the day to see the rest.');
  if (all.dropped.unreadable > 0) bits.push(all.dropped.unreadable + ' could not be read and are not shown.');
  el.eventNote.textContent = bits.join(' ');
  updateStepButtons();
}

/**
 * One <div class="mark KIND"> per marker, inserted before the playhead so the
 * playhead stays last. The title is plain words: an operator hovering a mark
 * should learn what and when without clicking.
 */
function drawMarks(markers) {
  for (const c of Array.from(el.strip.childNodes)) {
    if (c !== el.playhead && c.className && String(c.className).startsWith('mark')) el.strip.removeChild(c);
  }
  for (const m of markers) {
    const div = document.createElement('div');
    div.className = 'mark ' + m.kind + (m.id === view.here ? ' here' : '');
    div.style.left = (m.fraction * 100) + '%';
    div.title = eventWords(m);
    div.addEventListener('click', (event) => {
      // The strip itself seeks to wherever it was clicked; a mark is more
      // specific than that, so it must not do both.
      event.stopPropagation();
      goToEvent(m);
    });
    el.strip.insertBefore(div, el.playhead);
  }
}

/**
 * The one IntersectionObserver every tile's thumbnail shares, built lazily by
 * cropObserver() the first time there is one to build. null until then, and
 * forever after on a browser with no IntersectionObserver at all.
 */
let cropWatcher = null;

/**
 * The shared observer that decides WHEN a tile asks the recorder for its
 * thumbnail: the whole frame with the detection drawn on it (GET /event-crop cuts
 * it; this only decides the moment to ask).
 *
 * 1. A day can hold hundreds of events. Asking for all of their crops at once
 *    would spawn hundreds of ffmpeg jobs on the recorder for tiles nobody
 *    scrolled to, so the request waits for the tile to actually be on screen.
 * 2. No IntersectionObserver at all (an old or embedded browser): return null
 *    and every tile falls back to words with no picture. Requesting nothing
 *    is a usable tile; requesting everything is the failure this exists to
 *    prevent.
 * 3. Built once and reused: every tile from every day shares one observer.
 */
function cropObserver() {
  if (typeof IntersectionObserver !== 'function') return null;
  if (cropWatcher === null) {
    cropWatcher = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        // Asked for once: stop watching before the request goes out, so a
        // tile that scrolls back into view never asks twice.
        cropWatcher.unobserve(entry.target);
        entry.target.src = entry.target.cropSrc;
      }
    });
  }
  return cropWatcher;
}

/**
 * A tile's thumbnail, wired to load once the tile is actually visible.
 * 1. No observer available: leave the <img> exactly as drawTiles left it
 *    (hidden, no src) and ask for nothing.
 * 2. Otherwise remember this event's crop URL on the element and start
 *    watching it; the observer above fills in `src` the moment it appears.
 */
function watchForCrop(img, eventId) {
  const observer = cropObserver();
  if (observer === null) return;
  img.cropSrc = '/event-crop?id=' + encodeURIComponent(eventId);
  observer.observe(img);
}

/** A row of tiles, oldest first, one per shown event, each with a lazy thumbnail. */
function drawTiles(markers) {
  el.eventTiles.textContent = '';
  // The tiles this redraw is about to discard must stop being watched, or a
  // day with hundreds of events clicked through repeatedly (Next, a filter, a
  // fresh day) piles up off-screen observations the observer never fires.
  if (cropWatcher !== null) cropWatcher.disconnect();
  for (const m of markers) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = m.kind + (m.id === view.here ? ' here' : '');
    const thumbBox = document.createElement('span');
    thumbBox.className = 'thumbBox';
    const img = document.createElement('img');
    img.className = 'thumb';
    img.alt = '';
    // Hidden until it loads: an <img> with no source shown eagerly is either
    // blank or, worse, the browser's broken-image icon while nothing has even
    // been asked for yet.
    img.hidden = true;
    img.addEventListener('load', () => { img.hidden = false; });
    // A 404 (footage evicted), a network hiccup, anything: hide it and leave
    // it hidden. No retry — a tile that failed once stays a words-only tile.
    img.addEventListener('error', () => { img.hidden = true; });
    thumbBox.appendChild(img);
    const when = document.createElement('span');
    when.className = 'when';
    when.textContent = localTime(m.atUtc);
    const what = document.createElement('span');
    what.className = 'what';
    what.textContent = eventWords(m);
    b.appendChild(thumbBox);
    b.appendChild(when);
    b.appendChild(what);
    b.addEventListener('click', () => { goToEvent(m); });
    el.eventTiles.appendChild(b);
    watchForCrop(img, m.id);
  }
}

/**
 * Plain words for one event: what it was, how long it lasted, and its plate
 * when there is one. No confidence score — a number an operator cannot act on
 * invites them to argue with the machine instead of watching the footage.
 */
function eventWords(m) {
  const what = m.kind === 'person' ? 'Person' : m.kind === 'vehicle' ? 'Vehicle' : 'Plate';
  const seconds = Math.round((Date.parse(m.untilUtc) - Date.parse(m.atUtc)) / 1000);
  const how = seconds >= 60
    ? Math.floor(seconds / 60) + ' min ' + (seconds % 60) + ' s'
    : Math.max(seconds, 1) + ' s';
  return what + (m.plate ? ' ' + m.plate : '') + ', ' + localTime(m.atUtc) + ', ' + how;
}

/** The instant on screen: where the video is, or the start of the day. */
function currentMomentUtc() {
  if (view.playing !== null) {
    return new Date(Date.parse(view.playing.segmentStartUtc) + el.video.currentTime * 1000).toISOString();
  }
  return view.requested === null ? null : view.requested.startUtc;
}

/** Play from a little before `marker`, and mark it as the one we are on. */
function goToEvent(marker) {
  if (view.requested === null) return;
  const at = seekInstantFor(marker, view.requested.startUtc, view.requested.endUtc);
  if (at === null) return;
  view.here = marker.id;
  drawMarks(view.markers);
  drawTiles(view.markers);
  updateStepButtons();
  setStatus(eventWords(marker), '');
  playAt(at);
}

/**
 * Grey the step buttons when there is nothing that way, so a button that does
 * nothing looks like a button that cannot do anything.
 */
function updateStepButtons() {
  const from = currentMomentUtc();
  el.prevEvent.disabled = from === null || stepToEvent(view.markers, from, 'previous', view.here) === null;
  el.nextEvent.disabled = from === null || stepToEvent(view.markers, from, 'next', view.here) === null;
}

/** Jump to the next or previous shown event, or say there is not one. */
function stepEvent(direction) {
  const from = currentMomentUtc();
  if (from === null) return;
  const next = stepToEvent(view.markers, from, direction, view.here);
  if (next === null) {
    setStatus(direction === 'next' ? 'No later event on this day' : 'No earlier event on this day', '');
    return;
  }
  goToEvent(next);
}

function clearStrip() {
  view.requested = null;
  view.events = [];
  view.markers = [];
  view.here = null;
  view.eventSeq++;
  el.events.hidden = true;
  el.eventTiles.textContent = '';
  el.eventNote.textContent = '';
  for (const c of Array.from(el.strip.childNodes)) {
    if (c !== el.playhead) el.strip.removeChild(c);
  }
  el.playhead.hidden = true;
  for (const c of Array.from(el.hours.childNodes)) {
    el.hours.removeChild(c);
  }
}

/**
 * Draw `bars` (layoutCoverage's bars) into el.strip. First remove every child
 * of el.strip except el.playhead. Then, for each bar, one <div> with class
 * "bar " + bar.kind, style.left = (bar.left * 100) + "%", style.width =
 * (bar.width * 100) + "%", inserted BEFORE el.playhead so the playhead stays
 * on top. div.title (textContent-safe, it is an attribute) is:
 * - gap: describeGap(bar.gapReason, bar.gapSource) + ", " +
 *   localTime(bar.startUtc) + " to " + localTime(bar.endUtc)
 * - recorded: "Recorded, " + localTime(bar.startUtc) + " to " + localTime(bar.endUtc)
 * - nodata: "No footage kept for this time" — plain words, same as every
 *   other title here; this is time the recorder never held, not a failure,
 *   so it gets no reason and no times (see .bar.nodata below: it renders as
 *   nothing, so there is nothing to add a legend entry for either).
 * - future: "Not yet happened"
 */
function drawStrip(bars) {
  // Remove old bars except playhead
  for (const c of Array.from(el.strip.childNodes)) {
    if (c !== el.playhead) el.strip.removeChild(c);
  }
  // For each bar
  for (const bar of bars) {
    const div = document.createElement('div');
    div.className = 'bar ' + bar.kind;
    div.style.left = (bar.left * 100) + '%';
    div.style.width = (bar.width * 100) + '%';
    let title = '';
    if (bar.kind === 'gap') {
      title = describeGap(bar.gapReason, bar.gapSource) + ', ' + localTime(bar.startUtc) + ' to ' + localTime(bar.endUtc);
    } else if (bar.kind === 'recorded') {
      title = 'Recorded, ' + localTime(bar.startUtc) + ' to ' + localTime(bar.endUtc);
    } else if (bar.kind === 'nodata') {
      title = 'No footage kept for this time';
    } else if (bar.kind === 'future') {
      title = 'Not yet happened';
    }
    div.title = title;
    el.strip.insertBefore(div, el.playhead);
  }
}

/**
 * Hour labels under the strip, every 3 hours of the local day `win`
 * ({ startUtc, endUtc } from dayWindow). Remove every child of el.hours.
 * Take y, m, d from new Date(win.startUtc) (getFullYear, getMonth, getDate).
 * For h = 0, 3, 6, ... 21: t = new Date(y, m, d, h).toISOString();
 * f = instantToFraction(t, win.startUtc, win.endUtc); skip when f is null;
 * add a <span> with textContent = two(new Date(t).getHours()) + ":00" and
 * style.left = (f * 100) + "%". (On a DST day an hour may not exist and the
 * Date constructor moves it; reading the hour back is what gets labelled.)
 */
function drawHours(win) {
  // Remove old labels
  for (const c of Array.from(el.hours.childNodes)) el.hours.removeChild(c);
  const s = new Date(win.startUtc);
  const y = s.getFullYear(), m = s.getMonth(), d = s.getDate();
  for (let h = 0; h < 24; h += 3) {
    const t = new Date(y, m, d, h).toISOString();
    const f = instantToFraction(t, win.startUtc, win.endUtc);
    if (f === null) continue;
    const span = document.createElement('span');
    span.textContent = two(new Date(t).getHours()) + ':00';
    span.style.left = (f * 100) + '%';
    el.hours.appendChild(span);
  }
}

/**
 * Place the playhead at the UTC instant `utc` on the drawn day, or hide it.
 * Hide (el.playhead.hidden = true) when utc is null, view.requested is null,
 * or instantToFraction(utc, view.requested.startUtc, view.requested.endUtc)
 * is null. Otherwise el.playhead.hidden = false and
 * el.playhead.style.left = (f * 100) + "%".
 */
function movePlayhead(utc) {
  if (!utc || !view.requested) {
    el.playhead.hidden = true;
    return;
  }
  const f = instantToFraction(utc, view.requested.startUtc, view.requested.endUtc);
  if (f === null || f === undefined) {
    el.playhead.hidden = true;
    return;
  }
  el.playhead.hidden = false;
  el.playhead.style.left = (f * 100) + '%';
}

/**
 * Resolve the instant `utc` for the selected camera and act on it.
 * First const seq = ++view.playSeq. GET /playback with URLSearchParams
 * camera = el.camera.value, at = utc. After the await (success or failure),
 * if seq !== view.playSeq return without touching anything: a later click,
 * or stopVideo() (camera or day changed), superseded this request.
 * Read the JSON even on a non-2xx status: refusals are JSON bodies with
 * ok: false, and planPlayback reads those too. When the fetch itself fails or
 * the body is not JSON, applyPlan({ action: "error", code: "unreachable",
 * message: "cannot reach the recorder" }). Otherwise applyPlan(planPlayback(body)).
 * The try/catch covers ONLY the fetch and res.json(); applyPlan runs outside
 * it, so an error thrown while applying reaches the caller as itself.
 */
async function playAt(utc) {
  const seq = ++view.playSeq;
  const q = new URLSearchParams({ camera: el.camera.value, at: utc });
  let body;
  let reached = true;
  try {
    const res = await fetch('/playback?' + q.toString());
    body = await res.json();
  } catch (e) {
    reached = false;
  }
  if (seq !== view.playSeq) return;
  if (!reached) {
    applyPlan({ action: 'error', code: 'unreachable', message: 'cannot reach the recorder' });
    return;
  }
  applyPlan(planPlayback(body));
}

/**
 * Carry out one planPlayback action.
 * Before every action except "play": stopVideo().
 * - "play": view.playing = plan; el.video.src = plan.src; when the video
 *   fires "loadedmetadata" ONCE (addEventListener with { once: true }), set
 *   el.video.currentTime = plan.offsetSeconds, then call el.video.play() and
 *   swallow its rejected promise with .catch(() => {}) (autoplay may be
 *   blocked; the controls remain). setStatus("Playing from " +
 *   localTime(instant) ) where instant = the segment start plus
 *   offsetSeconds: new Date(Date.parse(plan.segmentStartUtc) +
 *   plan.offsetSeconds * 1000).toISOString().
 * - "gap": setStatus(plan.label, "problem"). When plan.nextRecordedUtc is a
 *   string, append a <button type="button"> with textContent "Jump to next
 *   recording" to el.status (after the text; separate them with a space) whose
 *   click calls playAt(plan.nextRecordedUtc).
 * - "live": setStatus("This moment is still being recorded. "), then append an
 *   <a href="/"> with textContent "Watch live" to el.status.
 * - "future": setStatus("That moment has not happened yet").
 * - "error": setStatus(plan.code + ": " + plan.message, "problem").
 * - anything else: setStatus("unexpected plan", "problem").
 */
function applyPlan(plan) {
  const action = plan && typeof plan === 'object' ? plan.action : null;
  if (action !== 'play') {
    stopVideo();
  }
  if (action === 'play') {
    view.playing = plan;
    el.video.src = plan.src;
    el.video.addEventListener('loadedmetadata', () => {
      el.video.currentTime = plan.offsetSeconds;
      el.video.playbackRate = view.rate; // a new src resets the browser's rate
      const playPromise = el.video.play();
      if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {});
      }
    }, { once: true });
    const instant = new Date(Date.parse(plan.segmentStartUtc) + plan.offsetSeconds * 1000).toISOString();
    setStatus('Playing from ' + localTime(instant));
  } else if (action === 'gap') {
    setStatus(plan.label, 'problem');
    if (typeof plan.nextRecordedUtc === 'string') {
      el.status.appendChild(document.createTextNode(' '));
      const b = document.createElement('button');
      b.setAttribute('type', 'button');
      b.textContent = 'Jump to next recording';
      b.addEventListener('click', () => { playAt(plan.nextRecordedUtc); });
      el.status.appendChild(b);
    }
  } else if (action === 'live') {
    setStatus('This moment is still being recorded. ');
    const a = document.createElement('a');
    a.setAttribute('href', '/');
    a.textContent = 'Watch live';
    el.status.appendChild(a);
  } else if (action === 'future') {
    setStatus('That moment has not happened yet');
  } else if (action === 'error') {
    setStatus(plan.code + ': ' + plan.message, 'problem');
  } else {
    setStatus('unexpected plan', 'problem');
  }
  showSteps();
}

/**
 * Stop playback and forget it: view.playing = null; view.playSeq += 1 (any
 * /playback answer still on its way is now stale); el.video.pause();
 * el.video.removeAttribute("src"); el.video.load(); movePlayhead(null);
 * el.clock.textContent = "--:--:--" (an unknown time must not read as
 * midnight); showSteps().
 */
function stopVideo() {
  view.playing = null;
  view.playSeq += 1;
  el.video.pause();
  el.video.removeAttribute('src');
  el.video.load();
  movePlayhead(null);
  el.clock.textContent = '--:--:--';
  showSteps();
}

/* ── playback controls: speed and ±10s steps ───────────────────────────── */

/**
 * Step the playback speed one notch in `direction` (-1 slower, 1 faster) via
 * nextRate(), which clamps to PLAYBACK_RATES, then showRate().
 */
function setRate(direction) {
  view.rate = nextRate(view.rate, direction);
  showRate();
}

/**
 * Put view.rate on the video and its label, and disable Slower/Faster at the
 * ends of PLAYBACK_RATES so a click that would change nothing is impossible.
 */
function showRate() {
  el.video.playbackRate = view.rate;
  el.video.defaultPlaybackRate = view.rate;
  el.rate.textContent = rateLabel(view.rate);
  el.slower.disabled = view.rate === PLAYBACK_RATES[0];
  el.faster.disabled = view.rate === PLAYBACK_RATES[PLAYBACK_RATES.length - 1];
}

/**
 * -10s/+10s are enabled only while something is playing: a button that
 * silently does nothing makes an operator think the recorder is broken.
 */
function showSteps() {
  const off = view.playing === null;
  el.back10.disabled = off;
  el.fwd10.disabled = off;
}

/**
 * Move by deltaS seconds while the target stays inside the playing segment;
 * past either end (or with no known end, a NaN lengthS) hand the jump to
 * playAt(): the recorder decides, including reporting a gap. Never skip past
 * a gap.
 */
function step(deltaS) {
  if (view.playing === null) {
    return;
  }
  const lengthS = (Date.parse(view.playing.segmentEndUtc) - Date.parse(view.playing.segmentStartUtc)) / 1000;
  const target = el.video.currentTime + deltaS;
  if (target >= 0 && target < lengthS) {
    el.video.currentTime = target;
    return;
  }
  playAt(new Date(Date.parse(view.playing.segmentStartUtc) + target * 1000).toISOString());
}

/**
 * Wire every event. Called once, before loadCameras().
 * - el.day.value = the local today as "YYYY-MM-DD" (getFullYear,
 *   getMonth() + 1, getDate(), with two()).
 * - el.camera "change" and el.day "change": stopVideo(), setStatus(""), loadDay().
 * - el.prevDay / el.nextDay "click": v = shiftDay(el.day.value, -1 / +1);
 *   when v is not null: el.day.value = v, stopVideo(), setStatus(""), loadDay().
 * - el.strip "click": ignore when view.requested is null.
 *   rect = el.strip.getBoundingClientRect(); ignore when rect.width <= 0.
 *   r = fractionToInstant((event.clientX - rect.left) / rect.width,
 *   view.requested.startUtc, view.requested.endUtc); when r.error,
 *   setStatus(r.error, "problem") and stop; else playAt(r.utc).
 * - el.video "ended": when view.playing is not null, playAt(view.playing.segmentEndUtc)
 *   (continuous play: the next segment, or a labelled stop at a gap).
 * - el.video "timeupdate": when view.playing is not null,
 *   movePlayhead(new Date(Date.parse(view.playing.segmentStartUtc) +
 *   el.video.currentTime * 1000).toISOString()).
 * - el.video "error": only when view.playing is not null (removing the src
 *   also fires "error"): setStatus("This browser cannot play this recording
 *   (H.265 needs hardware decoding)", "problem").
 */
function wireEvents() {
  const now = new Date();
  el.day.value = now.getFullYear() + '-' + two(now.getMonth() + 1) + '-' + two(now.getDate());
  el.camera.addEventListener('change', () => {
    stopVideo();
    setStatus('');
    loadDay();
  });
  el.day.addEventListener('change', () => {
    stopVideo();
    setStatus('');
    loadDay();
  });
  el.prevDay.addEventListener('click', () => {
    const v = shiftDay(el.day.value, -1);
    if (v !== null) {
      el.day.value = v;
      stopVideo();
      setStatus('');
      loadDay();
    }
  });
  el.nextDay.addEventListener('click', () => {
    const v = shiftDay(el.day.value, 1);
    if (v !== null) {
      el.day.value = v;
      stopVideo();
      setStatus('');
      loadDay();
    }
  });
  el.strip.addEventListener('click', (event) => {
    if (view.requested === null) return;
    const rect = el.strip.getBoundingClientRect();
    if (!(rect.width > 0)) return;
    const r = fractionToInstant((event.clientX - rect.left) / rect.width, view.requested.startUtc, view.requested.endUtc);
    if (r.error) {
      setStatus(r.error, 'problem');
      return;
    }
    playAt(r.utc);
  });
  el.prevEvent.addEventListener('click', () => { stepEvent('previous'); });
  el.nextEvent.addEventListener('click', () => { stepEvent('next'); });
  for (const [kind, button] of [['person', el.filterPerson], ['vehicle', el.filterVehicle], ['plate', el.filterPlate]]) {
    button.addEventListener('click', () => {
      view.kinds = view.kinds.includes(kind)
        ? view.kinds.filter((k) => k !== kind)
        : [...view.kinds, kind];
      // The event we were on may have just been hidden; forget it rather than
      // stepping from something no longer on the bar.
      if (!view.kinds.includes(kind)) view.here = null;
      drawEvents();
    });
  }
  el.video.addEventListener('ended', () => {
    if (view.playing !== null) {
      playAt(view.playing.segmentEndUtc);
    }
  });
  el.video.addEventListener('timeupdate', () => {
    if (view.playing !== null) {
      const iso = new Date(Date.parse(view.playing.segmentStartUtc) + el.video.currentTime * 1000).toISOString();
      movePlayhead(iso);
      const now = new Date(iso);
      el.clock.textContent = two(now.getHours()) + ':' + two(now.getMinutes()) + ':' + two(now.getSeconds());
      // Once playback has run past the event we jumped to, we are no longer
      // "on" it: stepping goes back to the clock, so watching through three
      // events and pressing Next does not walk back to the second one.
      if (view.here !== null) {
        const m = view.markers.find((x) => x.id === view.here);
        if (m === undefined || Date.parse(iso) > Date.parse(m.untilUtc)) {
          view.here = null;
          drawMarks(view.markers);
          drawTiles(view.markers);
        }
      }
      updateStepButtons();
    }
  });
  el.video.addEventListener('error', () => {
    if (view.playing !== null) {
      setStatus('This browser cannot play this recording (H.265 needs hardware decoding)', 'problem');
    }
  });
  // Playback speed: 1x to start; stopVideo deliberately leaves it alone.
  view.rate = 1;
  el.slower.addEventListener('click', () => { setRate(-1); });
  el.faster.addEventListener('click', () => { setRate(1); });
  el.back10.addEventListener('click', () => { step(-10); });
  el.fwd10.addEventListener('click', () => { step(10); });
  showRate();
  showSteps();
}

/* ── export: one camera, a time range on the shown day, as a ZIP ──────────── */

/**
 * The local times `from` and `to` ("HH:MM", what <input type="time" step="60">
 * gives) on the local day `day` ("YYYY-MM-DD") as a UTC window
 * { startUtc, endUtc } (Date#toISOString), or null when:
 * - dayWindow(day) is null;
 * - from or to is not a string of exactly two digits, ":", two digits, with
 *   hours 0-23 and minutes 0-59;
 * - either time did not happen that day (spring forward: build each end with
 *   new Date(y, m - 1, d, hh, mm) and refuse when getHours() or getMinutes()
 *   do not read back hh and mm);
 * - the end is not strictly after the start (no overnight ranges).
 */
function exportWindow(day, from, to) {
  const win = dayWindow(day);
  if (win === null) return null;
  // A From/To option carries a whole instant, because the two 1 AMs of a
  // fall-back day are different instants with the same wall clock. A typed
  // "HH:MM" still works below.
  if (typeof from === 'string' && from.includes('T') && typeof to === 'string' && to.includes('T')) {
    const fromMs = Date.parse(from);
    const toMs = Date.parse(to);
    if (Number.isNaN(fromMs) || Number.isNaN(toMs) || toMs <= fromMs) return null;
    if (fromMs < Date.parse(win.startUtc) || toMs > Date.parse(win.endUtc)) return null;
    return {startUtc: new Date(fromMs).toISOString(), endUtc: new Date(toMs).toISOString()};
  }
  const timeRe = /^([0-9]{2}):([0-9]{2})$/;
  const parse = (t) => {
    if (typeof t !== 'string') return null;
    const m = timeRe.exec(t);
    if (!m) return null;
    const h = Number(m[1]), mm = Number(m[2]);
    if (h < 0 || h > 23 || mm < 0 || mm > 59) return null;
    return {h, m: mm};
  };
  const startP = parse(from);
  const endP = parse(to);
  if (!startP || !endP) return null;
  const dayRe = /^([0-9]{4})-([0-9]{2})-([0-9]{2})$/;
  const dM = dayRe.exec(day);
  if (!dM) return null;
  const y = Number(dM[1]), mo = Number(dM[2]), d = Number(dM[3]);
  const start = new Date(y, mo - 1, d, startP.h, startP.m);
  if (start.getHours() !== startP.h || start.getMinutes() !== startP.m) return null;
  const end = new Date(y, mo - 1, d, endP.h, endP.m);
  if (end.getHours() !== endP.h || end.getMinutes() !== endP.m) return null;
  if (end.getTime() <= start.getTime()) return null;
  return {startUtc: start.toISOString(), endUtc: end.toISOString()};
}

/**
 * Replace what the export line shows. `parts` is an array of strings and
 * elements, put in with el.exportStatus.replaceChildren(...parts) (strings go
 * in as text, never as HTML). kind "problem" sets className
 * "exportStatus problem"; anything else "exportStatus".
 */
function setExportStatus(parts, kind) {
  el.exportStatus.className = kind === 'problem' ? 'exportStatus problem' : 'exportStatus';
  el.exportStatus.replaceChildren(...parts);
}

/** Forget any offer, shown or on its way: view.exportSeq++, then setExportStatus([]). */
function clearExport() {
  view.exportSeq += 1;
  setExportStatus([]);
}

/**
 * Ask the recorder what an export of the chosen range would deliver, and offer
 * the download. Returns nothing; every outcome is shown on the export line.
 * 1. const seq = ++view.exportSeq.
 * 2. const win = exportWindow(el.day.value, el.exportFrom.value, el.exportTo.value).
 *    null: setExportStatus(["Pick a start and an end time on this day, the end after the start"], "problem")
 *    and return, with no fetch.
 * 3. const q = new URLSearchParams({ camera: el.camera.value, start: win.startUtc, end: win.endUtc }).
 * 4. try { res = await fetch('/export/plan?' + q.toString()); body = await res.json(); }
 *    The try covers ONLY those two lines. On a throw: after the seq check below,
 *    setExportStatus(["Cannot reach the recorder (" + location.host + ")"], "problem") and return.
 * 5. If seq !== view.exportSeq, return (the user changed something meanwhile).
 * 6. const offer = planExportOffer(body). action "error":
 *    setExportStatus([offer.code + ": " + offer.message], "problem") and return.
 * 7. action "offer": a link a = document.createElement('a');
 *    a.setAttribute('href', '/export?' + q.toString()); a.textContent = 'Download ZIP'.
 *    The text: fileCount + (fileCount === 1 ? " file, " : " files, ") + offer.size + ", "
 *    + localTime(offer.deliveredStartUtc) + " to " + localTime(offer.deliveredEndUtc)
 *    + (gapCount === 0 ? "" : ", " + gapCount + (gapCount === 1 ? " gap" : " gaps") + " not recorded")
 *    + ". "
 *    setExportStatus([text, a]) (plain kind).
 */
async function offerExport() {
  const seq = ++view.exportSeq;
  const win = chosenWindow();
  if (!win) {
    setExportStatus(['Pick a start and an end time on this day, the end after the start'], 'problem');
    return;
  }
  const q = new URLSearchParams({ camera: el.camera.value, start: win.startUtc, end: win.endUtc });
  let body;
  let reached = true;
  try {
    const res = await fetch('/export/plan?' + q.toString());
    body = await res.json();
  } catch (e) {
    reached = false;
  }
  if (seq !== view.exportSeq) return;
  if (!reached) {
    setExportStatus(['Cannot reach the recorder (' + location.host + ')'], 'problem');
    return;
  }
  const offer = planExportOffer(body);
  if (offer.action === 'error') {
    setExportStatus([friendlyProblem(offer.code, offer.message)], 'problem');
    return;
  }
  const a = document.createElement('a');
  a.setAttribute('href', '/export?' + q.toString());
  a.textContent = 'Download ZIP';
  const text = offer.fileCount + (offer.fileCount === 1 ? ' file, ' : ' files, ') + offer.size + ', '
    + localTime(offer.deliveredStartUtc) + ' to ' + localTime(offer.deliveredEndUtc)
    + (offer.gapCount === 0 ? '' : ', ' + offer.gapCount + (offer.gapCount === 1 ? ' gap' : ' gaps') + ' not recorded')
    + '. ';
  setExportStatus([text, a]);
}

/**
 * Hook the export control up. exportBtn "click" calls offerExport(). A shown
 * offer describes one camera, day and range, so each of these calls
 * clearExport(): exportFrom "change", exportTo "change", camera "change",
 * day "change", prevDay "click", nextDay "click".
 */
function wireExport() {
  el.exportBtn.addEventListener('click', () => { offerExport(); });
  el.exportFrom.addEventListener('change', clearExport);
  el.exportTo.addEventListener('change', clearExport);
  el.camera.addEventListener('change', clearExport);
  el.day.addEventListener('change', clearExport);
  el.prevDay.addEventListener('click', clearExport);
  el.nextDay.addEventListener('click', clearExport);
}

/* ── test clips: the same range, kept as an answer for the AI (AI-PLAN D0) ── */

// The scene boxes, in page order. Looked up by id: the page never queries by selector.
const CLIP_TAGS = ['empty', 'person', 'vehicle', 'shadows', 'headlights', 'rain', 'animal', 'night'];
const clipTagBox = (tag) => document.getElementById('clipTag-' + tag);

// setClipStatus updates the status element with optional styling
function setClipStatus(text, kind) {
  const statusEl = document.getElementById('clipStatus');
  statusEl.textContent = text;
  statusEl.className = 'clipStatus';
  if (kind === 'problem') statusEl.className += ' problem';
  else if (kind === 'saved') statusEl.className += ' saved';
}

// saveTestClip handles the async saving of a test clip
async function saveTestClip() {
  const seq = ++view.clipSeq;
  const win = chosenWindow();
  if (!win) {
    setClipStatus('Pick a start and an end time above, the end after the start', 'problem');
    return;
  }
  const scenes = CLIP_TAGS.filter((tag) => clipTagBox(tag).checked);
  const clipPeople = document.getElementById('clipPeople');
  const clipVehicles = document.getElementById('clipVehicles');
  const people = Number(clipPeople.value);
  const vehicles = Number(clipVehicles.value);
  if (scenes.length === 0) {
    setClipStatus('Tick at least one box that describes the clip', 'problem');
    return;
  }
  const clipSaveBtn = document.getElementById('clipSaveBtn');
  clipSaveBtn.disabled = true;
  setClipStatus('Saving...');
  let reached = true;
  let res, body;
  try {
    res = await fetch('/clip-library', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cameraId: el.camera.value,
        startUtc: win.startUtc,
        endUtc: win.endUtc,
        scenes,
        people,
        vehicles
      })
    });
    body = await res.json();
  } catch {
    reached = false;
  } finally {
    clipSaveBtn.disabled = false;
  }
  if (seq !== view.clipSeq) return;
  if (!reached) {
    setClipStatus('Cannot reach the recorder (' + location.host + ')', 'problem');
    return;
  }
  if (res.status === 403) {
    setClipStatus('This account cannot save test clips', 'problem');
    return;
  }
  if (body && body.ok) {
    const fileText = body.fileCount === 1 ? ' file, ' : ' files, ';
    const peopleText = people
      ? people + (people === 1 ? ' person' : ' people')
      : 'no people';
    const vehicleText = vehicles
      ? vehicles + (vehicles === 1 ? ' vehicle' : ' vehicles')
      : 'no vehicles';
    setClipStatus(
      'Saved test clip: ' +
        body.fileCount +
        fileText +
        localTime(body.clip.startUtc) +
        ' to ' +
        localTime(body.clip.endUtc) +
        ', ' +
        peopleText +
        ', ' +
        vehicleText +
        '.',
      'saved'
    );
    return;
  }
  if (body && body.code === 'bad_clip' && Array.isArray(body.errors)) {
    setClipStatus('Not saved: ' + body.errors.join('; '), 'problem');
    return;
  }
  setClipStatus(
    'Not saved: ' +
      (body && (body.code || body.message)
        ? friendlyProblem(body.code, body.message)
        : 'the recorder refused (' + res.status + ')'),
    'problem'
  );
}

// wireTestClip sets up the test clip UI and event handlers
function wireTestClip() {
  const clipPeople = document.getElementById('clipPeople');
  const clipVehicles = document.getElementById('clipVehicles');
  const emptyBox = clipTagBox('empty');
  const personBox = clipTagBox('person');
  const vehicleBox = clipTagBox('vehicle');
  const clipSaveBtn = document.getElementById('clipSaveBtn');

  // Populate selects 0..10
  for (let i = 0; i <= 10; i++) {
    const optP = document.createElement('option');
    optP.value = String(i);
    optP.textContent = String(i);
    clipPeople.appendChild(optP);
    const optV = document.createElement('option');
    optV.value = String(i);
    optV.textContent = String(i);
    clipVehicles.appendChild(optV);
  }
  clipPeople.value = '0';
  clipVehicles.value = '0';
  view.clipSeq = 0;

  const clearStatus = () => {
    setClipStatus('');
    view.clipSeq += 1;
  };

  clipPeople.addEventListener('change', () => {
    if (Number(clipPeople.value) > 0) {
      personBox.checked = true;
      emptyBox.checked = false;
    }
    clearStatus();
  });

  clipVehicles.addEventListener('change', () => {
    if (Number(clipVehicles.value) > 0) {
      vehicleBox.checked = true;
      emptyBox.checked = false;
    }
    clearStatus();
  });

  emptyBox.addEventListener('change', () => {
    if (emptyBox.checked) {
      personBox.checked = false;
      vehicleBox.checked = false;
      clipPeople.value = '0';
      clipVehicles.value = '0';
    }
    clearStatus();
  });

  el.camera.addEventListener('change', clearStatus);
  el.day.addEventListener('change', clearStatus);
  el.exportFrom.addEventListener('change', clearStatus);
  el.exportTo.addEventListener('change', clearStatus);
  el.prevDay.addEventListener('click', clearStatus);
  el.nextDay.addEventListener('click', clearStatus);

  clipSaveBtn.addEventListener('click', saveTestClip);
}

/* ── the friendly page: a camera, a day, a moment ──────────────────────────
 * Every decision that can be wrong without looking wrong lives in
 * /ui/review-client.js and is harness-tested. What is here only draws what
 * those helpers decided and asks the recorder.
 */

// The zone the wall clock on this phone is in. Every local time the page shows
// or offers is formatted in it, and it is passed in rather than assumed.
const LOCAL_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;
const SAVE_LENGTHS = [1, 5, 15, 60];
const TEACH_LENGTHS = [1, 2, 5];

/** The instant on screen, or null when nothing is playing. */
function watchedInstant() {
  if (view.playing === null) return null;
  const ms = Date.parse(view.playing.segmentStartUtc) + el.video.currentTime * 1000;
  return Number.isFinite(ms) ? new Date(ms).toISOString() : null;
}

/**
 * One tile per camera, from the same list the (hidden) select holds, so the
 * tiles and the page's answer to "which camera" cannot drift apart. The
 * chosen one carries the class "chosen".
 */
function drawCameraTiles() {
  const tiles = [];
  for (const opt of Array.from(el.camera.childNodes)) {
    const tile = document.createElement('button');
    tile.setAttribute('type', 'button');
    tile.className = opt.value === el.camera.value ? 'camTile chosen' : 'camTile';
    tile.textContent = opt.textContent;
    tile.addEventListener('click', () => { chooseCamera(opt.value); });
    tiles.push(tile);
  }
  el.cameraTiles.replaceChildren(...tiles);
}

/** Tapping a tile is choosing in the select: same event, same consequences. */
function chooseCamera(cameraId) {
  if (el.camera.value === cameraId) return;
  el.camera.value = cameraId;
  el.camera.dispatchEvent(new Event('change'));
}

/** Tapping a day in the calendar is choosing in the date input. */
function chooseDay(day) {
  if (el.day.value !== day) {
    el.day.value = day;
    el.day.dispatchEvent(new Event('change'));
  }
  showCalendar(false);
}

/** What the day button reads. */
function drawDayButton() {
  el.dayBtn.textContent = el.day.value ? 'Day: ' + el.day.value : 'Pick a day';
}

/**
 * Open or close the calendar. Opening moves it to the month of the day being
 * shown and asks the recorder which of that month's days have footage.
 */
function showCalendar(show) {
  el.calendar.hidden = !show;
  el.dayBtn.setAttribute('aria-expanded', show ? 'true' : 'false');
  if (!show) return;
  const m = /^([0-9]{4})-([0-9]{2})-[0-9]{2}$/.exec(el.day.value || '');
  if (m) {
    view.calYear = Number(m[1]);
    view.calMonth = Number(m[2]);
  }
  drawCalendar();
  loadMonth();
}

/** Step the calendar a month at a time. */
function stepMonth(delta) {
  let month = view.calMonth + delta;
  let year = view.calYear;
  if (month < 1) { month = 12; year -= 1; }
  if (month > 12) { month = 1; year += 1; }
  view.calYear = year;
  view.calMonth = month;
  view.recordedDays = [];
  drawCalendar();
  loadMonth();
}

/**
 * Draw the month grid from monthCalendar. A day with footage is marked; a day
 * without one is still tappable, because an empty strip is an answer too.
 */
function drawCalendar() {
  const cal = monthCalendar(view.calYear, view.calMonth, view.recordedDays);
  if (cal.error) {
    el.calLabel.textContent = 'No calendar';
    el.calGrid.replaceChildren();
    return;
  }
  el.calLabel.textContent = cal.label;
  const cells = [];
  for (const week of cal.weeks) {
    for (const cell of week) {
      if (cell === null) {
        const blank = document.createElement('span');
        blank.className = 'calBlank';
        cells.push(blank);
        continue;
      }
      const btn = document.createElement('button');
      btn.setAttribute('type', 'button');
      btn.textContent = String(cell.dayOfMonth);
      btn.className = 'calDay' + (cell.recorded ? ' recorded' : '')
        + (cell.day === el.day.value ? ' chosen' : '');
      btn.title = cell.recorded ? cell.day + ': recorded' : cell.day + ': nothing recorded';
      // A dot, not just a colour: the chosen day is coloured too, and one
      // meaning must not hide the other.
      if (cell.recorded) {
        const dot = document.createElement('span');
        dot.className = 'calDot';
        btn.appendChild(dot);
      }
      btn.addEventListener('click', () => { chooseDay(cell.day); });
      cells.push(btn);
    }
  }
  el.calGrid.replaceChildren(...cells);
}

/**
 * Which days of the shown month have footage. One /timeline call for the whole
 * month (MAX_WINDOW_SECONDS is 35 days, so a month fits), then recordedDays
 * over its runs. A month that has not started yet, or a recorder that will not
 * answer, marks nothing rather than guessing. view.monthSeq drops the answer
 * for a month or camera the user has already left.
 */
async function loadMonth() {
  const seq = ++view.monthSeq;
  const two2 = (n) => String(n).padStart(2, '0');
  const first = dayWindow(view.calYear + '-' + two2(view.calMonth) + '-01');
  const lastOfMonth = new Date(Date.UTC(view.calYear, view.calMonth, 0)).getUTCDate();
  const last = dayWindow(view.calYear + '-' + two2(view.calMonth) + '-' + two2(lastOfMonth));
  if (first === null || last === null) return;
  const nowUtc = new Date().toISOString();
  const end = Date.parse(last.endUtc) > Date.parse(nowUtc) ? nowUtc : last.endUtc;
  if (Date.parse(end) <= Date.parse(first.startUtc)) {
    view.recordedDays = [];
    drawCalendar();
    return;
  }
  const q = new URLSearchParams({ camera: el.camera.value, start: first.startUtc, end });
  let body = null;
  try {
    const res = await fetch('/timeline?' + q.toString());
    body = await res.json();
  } catch (e) {
    body = null;
  }
  if (seq !== view.monthSeq) return;
  const runs = body !== null && typeof body === 'object' && body.ok === true && Array.isArray(body.runs)
    ? body.runs : [];
  const found = recordedDays(runs, LOCAL_ZONE);
  view.recordedDays = found.error ? [] : found.days;
  drawCalendar();
}

/**
 * Fill the From and To dropdowns with every quarter hour of the shown day, so
 * a time is tapped and never typed. A step with no recording is offered and
 * said to be empty rather than hidden: the person may want the boundary.
 * A selection that survives the refill is kept; otherwise From goes to the
 * first recorded step and To to the last.
 */
function fillTimeDropdowns(runs) {
  const win = dayWindow(el.day.value);
  const built = win === null
    ? { error: 'no day' }
    : timeOptions(Array.isArray(runs) ? runs : [], win.startUtc, win.endUtc, 15, LOCAL_ZONE);
  if (built.error) {
    el.exportFrom.replaceChildren();
    el.exportTo.replaceChildren();
    return;
  }
  const recorded = built.options.filter((o) => o.recorded);
  for (const [select, fallback] of [[el.exportFrom, recorded[0]], [el.exportTo, recorded.at(-1)]]) {
    const keep = select.value;
    select.replaceChildren(...built.options.map((o) => {
      const option = document.createElement('option');
      option.value = o.value;
      option.textContent = o.recorded ? o.label : o.label + ' (nothing recorded)';
      return option;
    }));
    const kept = built.options.some((o) => o.value === keep);
    select.value = kept ? keep : (fallback ? fallback.value : built.options[0].value);
  }
}

/**
 * The range every action uses. A length chip wins while the sheet is showing
 * one, because that is what the person last touched; otherwise it is whatever
 * the Exact times dropdowns say.
 */
function chosenWindow() {
  if (view.sheetWindow !== null) return view.sheetWindow;
  return exportWindow(el.day.value, el.exportFrom.value, el.exportTo.value);
}

/**
 * Say, inside Exact times, which of the two answers is in force. Two ranges on
 * screen for one download is the kind of thing that looks fine and is wrong, so
 * the dropdowns are never left standing as if they decided it.
 */
function showExactNote() {
  if (view.sheetWindow === null) {
    el.exactNote.textContent = 'These times are the ones that will be used.';
    return;
  }
  el.exactNote.textContent = 'The length button above is in use ('
    + localTime(view.sheetWindow.startUtc) + ' to ' + localTime(view.sheetWindow.endUtc)
    + '). Choose a time here to use these instead.';
}

/** Replace what the sheet's status line says. */
function setSheetStatus(text, kind) {
  el.sheetStatus.textContent = text;
  el.sheetStatus.className = kind === 'problem' ? 'sheetStatus problem'
    : kind === 'saved' ? 'sheetStatus saved' : 'sheetStatus';
}

/**
 * Open the sheet for the moment on screen. "save" downloads a stretch of it;
 * "teach" saves the same stretch as an answer for the AI. The only thing to
 * choose is how long.
 */
function openSheet(mode) {
  view.sheetMode = mode;
  el.sheet.hidden = false;
  el.sheetTitle.textContent = mode === 'teach' ? 'Teach the AI' : 'Save video';
  el.sheetGo.textContent = mode === 'teach' ? 'Save what I said' : 'Get the video';
  el.teachFields.hidden = mode !== 'teach';
  setSheetStatus('');
  setExportStatus([]);
  setClipStatus('');
  pickLength(mode === 'teach' ? 2 : 5);
  if (mode === 'teach') loadTeachProgress();
}

/** Close the sheet and forget the length it had chosen. */
function closeSheet() {
  el.sheet.hidden = true;
  view.sheetMode = null;
  view.sheetWindow = null;
  setSheetStatus('');
}

/** The length chips for the mode the sheet is in, the chosen one marked. */
function drawLengthChips() {
  const lengths = view.sheetMode === 'teach' ? TEACH_LENGTHS : SAVE_LENGTHS;
  el.lengthChips.replaceChildren(...lengths.map((min) => {
    const chip = document.createElement('button');
    chip.setAttribute('type', 'button');
    chip.className = min === view.sheetLength ? 'chip on' : 'chip';
    chip.textContent = min === 60 ? '1 hour' : min + ' min';
    chip.addEventListener('click', () => { pickLength(min); });
    return chip;
  }));
}

/**
 * Choose how long a stretch around the moment on screen. rangeAround decides
 * the window and says when it had to move it; this only shows what it decided.
 * With nothing playing there is no moment, so the sheet says so and chooses
 * nothing rather than picking a time of its own.
 */
function pickLength(min) {
  view.sheetLength = min;
  drawLengthChips();
  const moment = watchedInstant();
  const win = dayWindow(el.day.value);
  if (moment === null || win === null) {
    view.sheetWindow = null;
    el.sheetRange.textContent = 'Play the moment you want first, then pick a length.';
    showExactNote();
    return;
  }
  const around = rangeAround(moment, min, new Date().toISOString(), win.startUtc, win.endUtc);
  if (around.error) {
    view.sheetWindow = null;
    el.sheetRange.textContent = 'That length does not fit in this day.';
    showExactNote();
    return;
  }
  view.sheetWindow = { startUtc: around.startUtc, endUtc: around.endUtc };
  el.sheetRange.textContent = localTime(around.startUtc) + ' to ' + localTime(around.endUtc)
    + (around.clamped ? ' (moved to stay inside this day)' : '');
  showExactNote();
}

/** The Save button in the sheet does whichever thing the sheet was opened for. */
function sheetGo() {
  if (view.sheetMode === 'teach') saveTestClip();
  else offerExport();
}

/** Show the counts the hidden selects hold, and whether Nobody is on. */
function showCounts() {
  el.peopleN.textContent = el.clipPeople.value === '' ? '0' : el.clipPeople.value;
  el.vehiclesN.textContent = el.clipVehicles.value === '' ? '0' : el.clipVehicles.value;
  el.nobodyChip.className = clipTagBox('empty').checked ? 'chip on' : 'chip';
}

/**
 * People and Cars by tapping rather than by choosing from a list. The hidden
 * select stays the page's one answer for each, so what is saved cannot drift
 * from what is shown. A count back at zero drops the claim that there was one.
 */
function bumpCount(which, delta) {
  const select = which === 'people' ? el.clipPeople : el.clipVehicles;
  const n = Math.min(10, Math.max(0, Number(select.value === '' ? '0' : select.value) + delta));
  select.value = String(n);
  select.dispatchEvent(new Event('change'));
  if (n === 0) clipTagBox(which === 'people' ? 'person' : 'vehicle').checked = false;
  showCounts();
}

/** Nobody is the "empty" scene: turning it on zeroes both counts. */
function tapNobody() {
  const box = clipTagBox('empty');
  box.checked = !box.checked;
  box.dispatchEvent(new Event('change'));
  showCounts();
}

/**
 * How much the AI has been taught so far, counted by clipProgress. Numbers
 * only: the page does not say whether that is enough, and it names what it
 * could not read rather than counting it as nothing.
 */
async function loadTeachProgress() {
  let body = null;
  try {
    const res = await fetch('/clip-library');
    body = await res.json();
  } catch (e) {
    body = null;
  }
  if (body === null || typeof body !== 'object' || body.ok !== true) {
    el.teachProgress.textContent = '';
    return;
  }
  const p = clipProgress(body.library);
  if (p.error) {
    el.teachProgress.textContent = '';
    return;
  }
  el.teachProgress.textContent = p.clipCount + (p.clipCount === 1 ? ' clip' : ' clips')
    + ' saved so far: ' + p.personCount + ' people, ' + p.vehicleCount + ' cars, '
    + p.emptyMinutes + ' min of nobody'
    + (p.skipped === 0 ? '' : ' (' + p.skipped + ' could not be read)')
    + '. Still wanted: ' + p.personsStillNeeded + ' people, '
    + p.emptyMinutesStillNeeded + ' min of nobody.';
}

/**
 * Hook up the calendar, the tiles, the sheet and the counters. Choosing an
 * exact time by hand drops the length chip's window, because the dropdowns are
 * then the more recent answer.
 */
function wireFriendly() {
  el.dayBtn.addEventListener('click', () => { showCalendar(el.calendar.hidden); });
  el.calPrev.addEventListener('click', () => { stepMonth(-1); });
  el.calNext.addEventListener('click', () => { stepMonth(1); });
  el.saveVideoBtn.addEventListener('click', () => { openSheet('save'); });
  el.teachBtn.addEventListener('click', () => { openSheet('teach'); });
  el.sheetClose.addEventListener('click', closeSheet);
  el.sheetGo.addEventListener('click', sheetGo);
  el.nobodyChip.addEventListener('click', tapNobody);
  el.peopleMinus.addEventListener('click', () => { bumpCount('people', -1); });
  el.peoplePlus.addEventListener('click', () => { bumpCount('people', 1); });
  el.vehiclesMinus.addEventListener('click', () => { bumpCount('vehicles', -1); });
  el.vehiclesPlus.addEventListener('click', () => { bumpCount('vehicles', 1); });
  el.exportFrom.addEventListener('change', () => { view.sheetWindow = null; showExactNote(); });
  el.exportTo.addEventListener('change', () => { view.sheetWindow = null; showExactNote(); });
  el.camera.addEventListener('change', () => {
    drawCameraTiles();
    view.sheetWindow = null;
    if (!el.calendar.hidden) loadMonth();
  });
  el.day.addEventListener('change', () => {
    drawDayButton();
    view.sheetWindow = null;
  });
  el.prevDay.addEventListener('click', () => { view.sheetWindow = null; });
  el.nextDay.addEventListener('click', () => { view.sheetWindow = null; });
  drawDayButton();
  showCounts();
}

wireExport();
wireTestClip();
wireFriendly();
wireEvents();
loadCameras();
startAlertBanner(document.getElementById('alertBanner'));
</script>
