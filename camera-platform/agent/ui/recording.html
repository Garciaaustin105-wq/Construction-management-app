<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Recording</title>
<style>
:root { color-scheme: dark; } * { box-sizing: border-box; }
body { margin:0; padding:12px; background:#14161a; color:#e8eaed; font:14px/1.4 system-ui, sans-serif; }
.panel { background:#1b1d22; border:1px solid #2c2f36; border-radius:8px; padding:12px; }
.dim { color:#9aa0a6; }
.error { color:#ffb4b4; }
.good { color:#7ddc9a; }
button { font:inherit; padding:8px 12px; border:0; border-radius:6px; background:#4c8bf5; color:#fff; }
button.danger { background:#5a2323; color:#ffb4b4; }
button:disabled { opacity:0.6; }
input, select { font:inherit; color:inherit; background:#14161a; border:1px solid #2c2f36; border-radius:6px; padding:8px; }
.row input, .row select { max-width:100%; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.row strong, .row span { overflow-wrap:anywhere; }
.row label { min-width:0; }
label { display:flex; flex-direction:column; gap:4px; }
label > span { color:#9aa0a6; }
label.choice { flex-direction:row; align-items:center; }
nav { margin:0 0 12px; }
nav a { color:#9aa0a6; margin-right:12px; }
h1 { font-size:18px; margin:0 0 12px; }
h2 { font-size:16px; margin:0 0 8px; }
h3 { font-size:14px; margin:16px 0 8px; }
form { margin:0; }
#message { min-height:1.4em; margin:12px 0; }
section.panel { margin-bottom:12px; }
#storeList > .row { border-top:1px solid #2c2f36; padding:8px 0; }
input.bad, select.bad { border-color:#ffb4b4; }
[hidden]{display:none !important}
</style>
</head>
<body>
<nav>
  <a href="/">Live</a>
  <a href="/review">Review</a>
  <a href="/system">System</a>
  <a href="/cameras-page">Cameras</a>
  <a href="/accounts-page">Accounts</a>
</nav>
<h1>Recording</h1>
<div class="row">
  <span id="whoami" class="dim"></span>
  <button id="signOut" type="button">Sign out</button>
</div>
<p id="message" role="status" aria-live="polite"></p>

<section class="panel">
  <h2>Storage</h2>
  <p class="error" id="storageError" hidden></p>
  <div id="storeList"></div>
  <p class="dim" id="retentionLine" hidden></p>
</section>

<section class="panel">
  <h2>Keep recordings</h2>
  <p class="error" id="settingsNotice" hidden></p>
  <p id="currentSetting"></p>
  <div class="row">
    <label class="choice"><input id="limitNone" name="limitMode" type="radio" checked> Until the drives are full (oldest deleted first)</label>
    <label class="choice"><input id="limitDays" name="limitMode" type="radio"> For a set number of days</label>
    <label><span>Days</span><input id="days" type="number" step="1" disabled></label>
    <button id="saveRetention" type="button">Save</button>
  </div>
  <p class="dim" id="fillsFirst" hidden></p>
</section>

<section class="panel" id="confirmDelete" hidden>
  <p id="confirmDeleteText"></p>
  <div class="row">
    <button id="confirmDeleteYes" type="button" class="danger">Delete and save</button>
    <button id="confirmDeleteNo" type="button">Cancel</button>
  </div>
</section>

<script type="module" src="/ui/recording-client.js"></script>
</body>
</html>
