<!DOCTYPE html>
<!--
  System page for the camera-NVR web UI.

  Answers the one question an installer standing in front of the box
  has: is this thing actually recording? The page polls GET /health
  every 5 seconds and draws the overall verdict, the per-camera
  recording state, storage fill and the retention estimate.

  All rendering is done by /ui/system-client.js (served from
  agent/ui/system-client.mjs). Nulls are never drawn as zero: a missing
  measurement reads "not measured", a camera that never sealed reads
  "never", an unknown recorder state reads "unknown" in warning
  colours, and a failed poll keeps the last good data on screen and
  explains itself in #pollError.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; background:#14161a; color:#e8eaed;
         font:14px/1.4 system-ui, sans-serif; }
  h1 { margin:0; font-size:20px; display:flex; align-items:center;
       flex-wrap:wrap; gap:8px 12px; }
  h2 { margin:22px 0 8px; font-size:15px; }
  .dim { color:#9aa0a6; }
  .good { color:#7ddc9a; }
  .warn { color:#f1e3a0; }
  .bad { color:#ffb4b4; }
  #siteId { overflow-wrap:anywhere; }
  #asOf { font-size:13px; font-weight:400; }
  .chip { display:inline-block; padding:3px 12px; border-radius:12px;
          border:1px solid #2c2f36; background:#1b1d22;
          font-size:13px; font-weight:700; letter-spacing:1px; }
  .chip.good { color:#7ddc9a; }
  .chip.warn { color:#f1e3a0; background:#2c2a1d; }
  .chip.bad { color:#ffb4b4; background:#3a1d1d; }
  #totals { display:flex; flex-wrap:wrap; gap:10px 28px; margin-top:12px;
            padding:10px 14px; background:#1b1d22;
            border:1px solid #2c2f36; border-radius:8px; }
  .figure-value { font-size:18px; font-weight:600;
                  overflow-wrap:anywhere; }
  .figure-label { font-size:11px; color:#9aa0a6; letter-spacing:0.5px;
                  text-transform:uppercase; }
  #recorder { display:inline-block; margin:12px 0 0; padding:6px 12px;
              background:#1b1d22; border:1px solid #2c2f36;
              border-radius:6px; }
  #recorder.warn { background:#2c2a1d; }
  #recorder.bad { background:#3a1d1d; }
  .panel { margin-top:4px; padding:2px 14px 6px; background:#1b1d22;
           border:1px solid #2c2f36; border-radius:8px; }
  table { width:100%; border-collapse:collapse; }
  th { padding:10px 10px 6px 0; border-bottom:1px solid #2c2f36;
       text-align:left; font-size:11px; font-weight:600; color:#9aa0a6;
       letter-spacing:0.5px; text-transform:uppercase; }
  td { padding:8px 10px 8px 0; border-bottom:1px solid #2c2f36;
       vertical-align:top; overflow-wrap:anywhere; }
  tbody tr:last-child td { border-bottom:none; }
  .store { padding:10px 0; border-bottom:1px solid #2c2f36; }
  .store:last-child { border-bottom:none; }
  .store-head { display:flex; justify-content:space-between;
                align-items:baseline; gap:6px 12px; flex-wrap:wrap; }
  .store-root { overflow-wrap:anywhere; }
  .store-state { font-size:12px; }
  .bar { height:10px; margin:8px 0 4px; background:#23262c;
         border:1px solid #2c2f36; border-radius:5px; overflow:hidden; }
  .bar-fill { height:100%; }
  .bar-fill.good { background:#7ddc9a; }
  .bar-fill.warn { background:#f1e3a0; }
  .bar-fill.bad { background:#ffb4b4; }
  .store-usage { font-size:13px; color:#9aa0a6; }
  #pollError { margin:16px 0 0; padding:8px 12px; background:#3a1d1d;
               color:#ffb4b4; border-radius:6px; }
  #pollError[hidden] { display:none; }

  /* Phone in a car park: stack the camera table, never scroll sideways. */
  @media (max-width: 699px) {
    body { padding:8px; }
    #totals { gap:8px 18px; }
    .cameras-table thead { display:none; }
    .cameras-table, .cameras-table tbody, .cameras-table tr,
    .cameras-table td { display:block; width:auto; }
    .cameras-table tr { margin:0 0 8px; padding:2px 10px 6px;
                        background:#23262c; border:1px solid #2c2f36;
                        border-radius:8px; }
    .cameras-table tr:last-child { margin-bottom:0; }
    .cameras-table td { padding:3px 0; border-bottom:none; }
    .cameras-table td::before { content:attr(data-label);
                                display:inline-block; width:96px;
                                color:#9aa0a6; font-size:11px;
                                letter-spacing:0.5px;
                                text-transform:uppercase; }
  }
</style>
</head>
<body>
  <h1>
    <span id="siteId"></span>
    <span id="overall" class="chip">&hellip;</span>
    <span id="asOf" class="dim"></span>
  </h1>

  <div id="totals"></div>

  <p id="recorder">waiting for /health</p>

  <h2>Cameras</h2>
  <div class="panel">
    <table class="cameras-table">
      <thead>
        <tr>
          <th>Camera</th>
          <th>State</th>
          <th>Detail</th>
          <th>Measured</th>
          <th>Segments</th>
          <th>Size</th>
          <th>Last sealed</th>
        </tr>
      </thead>
      <tbody id="cameras"></tbody>
    </table>
  </div>

  <h2>Storage</h2>
  <div id="stores" class="panel"></div>

  <p id="pollError" hidden></p>

  <script type="module" src="/ui/system-client.js"></script>
<script type="module" src="/ui/session.js"></script>
</body>
</html>
